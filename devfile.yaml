schemaVersion: 2.2.2
metadata:
  name: python
  displayName: Python
  description: "Python (version 3.9.x) is an interpreted, object-oriented, high-level programming language with dynamic semantics.
    Its high-level built in data structures, combined with dynamic typing and dynamic binding, make it very attractive for Rapid Application Development, as well as for use as a scripting or glue language to connect existing components together."
  icon: https://raw.githubusercontent.com/devfile-samples/devfile-stack-icons/main/python.svg
  tags:
    - Python
    - Pip
    - Flask
    - UDI
  projectType: Python
  language: Python
  provider: Red Hat
  version: 2.2.0
components:
  # UDI first = default Dev Spaces terminal (oc, podman, helm, …)
  - name: tools
    container:
      image: registry.redhat.io/devspaces/udi-rhel9:latest
      memoryRequest: 1Gi
      memoryLimit: 3Gi
      cpuRequest: '200m'
      cpuLimit: '1'
      mountSources: true
      args: ['tail', '-f', '/dev/null']
      endpoints:
        - name: https-container
          targetPort: 8081
          protocol: https
  # Python runtime for build / run / debug
  - name: py
    container:
      image: registry.access.redhat.com/ubi9/python-39:1-1780505855
      args: ['tail', '-f', '/dev/null']
      mountSources: true
      endpoints:
        - name: https-python
          targetPort: 8080
          protocol: https
        - exposure: none
          name: debug
          targetPort: 5858
      env:
        - name: DEBUG_PORT
          value: '5858'
commands:
  - id: pip-install-requirements
    exec:
      commandLine: pip install -r requirements.txt
      workingDir: ${PROJECT_SOURCE}
      group:
        kind: build
        isDefault: true
      component: py
  - id: run-app
    exec:
      commandLine: 'python app.py'
      workingDir: ${PROJECT_SOURCE}
      component: py
      group:
        kind: run
        isDefault: true
  - id: debug-py
    exec:
      commandLine: 'pip install debugpy && python -m debugpy --listen 0.0.0.0:${DEBUG_PORT} app.py'
      workingDir: ${PROJECT_SOURCE}
      component: py
      group:
        kind: debug
  - id: podman-build
    exec:
      label: 'Podman build (Containerfile)'
      commandLine: podman build -t oc-devspaces-pythonapp -f Containerfile .
      workingDir: ${PROJECT_SOURCE}
      component: tools
      group:
        kind: build
  - id: podman-run
    exec:
      label: 'Podman run'
      commandLine: 'podman rm -f oc-devspaces-pythonapp 2>/dev/null; podman run --rm --name oc-devspaces-pythonapp -p 8081:8080 localhost/oc-devspaces-pythonapp'
      workingDir: ${PROJECT_SOURCE}
      component: tools
      group:
        kind: run
  - id: oc-apply-manifests
    exec:
      label: 'Apply OpenShift manifests'
      commandLine: oc apply -f openshift/
      workingDir: ${PROJECT_SOURCE}
      component: tools
      group:
        kind: deploy
